// ═══════════════════════════════════════════════════════════════
// ONEDRIVE (GRAPH API — personal Microsoft account, no Azure app reg needed for consumer)
// Uses MSAL with a public client (works with personal OneDrive)
// ═══════════════════════════════════════════════════════════════
// For personal OneDrive we use the "consumers" endpoint and the
// built-in Microsoft Office client_id for public apps,
// OR the user can supply their own client_id.
// We use a simple OAuth2 implicit flow via popup redirect.

let _odToken=null;
let _odConfig=null;
let _msalInstance=null;
let _odAccount=null;

function odAuthority(cfg){
  return cfg?.personal ? "https://login.microsoftonline.com/consumers" : "https://login.microsoftonline.com/organizations";
}

function getMsal(cfg){
  if(!cfg?.clientId || cfg.clientId === "6b6fa530-0197-4e16-a43d-09c36cfd5532") throw new Error("Enter your real Microsoft Application (Client) ID first.");
  const key = JSON.stringify({clientId:cfg.clientId,personal:!!cfg.personal,origin:window.location.origin});
  if(_msalInstance && _msalInstance.__key === key) return _msalInstance;
  _msalInstance = new msal.PublicClientApplication({
    auth:{
      clientId:cfg.clientId,
      authority:odAuthority(cfg),
      redirectUri:window.location.origin,
      postLogoutRedirectUri:window.location.origin,
    },
    cache:{
      cacheLocation:"localStorage",
      storeAuthStateInCookie:false,
    },
    system:{
      allowNativeBroker:false,
    }
  });
  _msalInstance.__key = key;
  return _msalInstance;
}

async function odSignIn(cfg){
  _odConfig=cfg;
  const app=getMsal(cfg);
  const scopes=["Files.ReadWrite","User.Read"];
  const existing=app.getAllAccounts();
  if(existing.length){
    _odAccount=existing[0];
    try{
      const silent=await app.acquireTokenSilent({scopes,account:_odAccount});
      _odToken=silent.accessToken;
      return _odToken;
    }catch(e){}
  }
  const login=await app.loginPopup({scopes,prompt:"select_account"});
  _odAccount=login.account;
  _odToken=login.accessToken;
  if(!_odToken){
    const token=await app.acquireTokenSilent({scopes,account:_odAccount});
    _odToken=token.accessToken;
  }
  if(!_odToken) throw new Error("Microsoft login completed, but no OneDrive token was returned.");
  return _odToken;
}

async function ensureODToken(){
  if(_odToken) return _odToken;
  if(!_odConfig) throw new Error("OneDrive is not configured.");
  return odSignIn(_odConfig);
}

function graphPath(path){
  return "https://graph.microsoft.com/v1.0"+path;
}

async function odFetch(path,opts={}){
  await ensureODToken();
  const headers={...(opts.headers||{}),Authorization:"Bearer "+_odToken};
  const res=await fetch(graphPath(path),{...opts,headers});
  if(res.status===401){
    _odToken=null;
    await ensureODToken();
    headers.Authorization="Bearer "+_odToken;
    const retry=await fetch(graphPath(path),{...opts,headers});
    if(!retry.ok) throw new Error(await retry.text() || ("OneDrive error "+retry.status));
    return retry;
  }
  if(!res.ok) throw new Error(await res.text() || ("OneDrive error "+res.status));
  return res;
}

async function odGet(path){
  const res=await odFetch(path);
  return res.json();
}
async function odPut(path,data,contentType){
  const res=await odFetch(path,{
    method:"PUT",headers:{"Content-Type":contentType||"application/octet-stream"},body:data
  });
  return res.json();
}
async function odPost(path,body){
  const res=await odFetch(path,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  });
  return res.json();
}

function safePathName(name){
  return String(name||"file").replace(/[\\/:*?"<>|#%{}~&]/g,"_").slice(0,120);
}

async function ensureFolder(folderPath){
  const parts=folderPath.split("/").filter(Boolean);
  let current="";
  for(const part of parts){
    const parent=current;
    current=current?current+"/"+part:part;
    try{
      await odGet("/me/drive/root:/"+encodeURIComponent(current).replace(/%2F/g,"/"));
    }catch{
      const endpoint=parent?"/me/drive/root:/"+encodeURIComponent(parent).replace(/%2F/g,"/")+":/children":"/me/drive/root/children";
      await odPost(endpoint,{name:part,folder:{},"@microsoft.graph.conflictBehavior":"replace"});
    }
  }
}

async function uploadBytesToOD(remotePath,blob,contentType){
  const cleanPath=remotePath.split("/").map(safePathName).join("/");
  // Simple upload is reliable up to 4 MB. Use upload session for anything larger.
  if(blob.size <= 4*1024*1024){
    return odPut("/me/drive/root:/"+cleanPath+":/content",blob,contentType||blob.type||"application/octet-stream");
  }
  const session=await odPost("/me/drive/root:/"+cleanPath+":/createUploadSession",{
    item:{"@microsoft.graph.conflictBehavior":"replace",name:cleanPath.split("/").pop()}
  });
  const chunkSize=320*1024*10; // must be a multiple of 320 KiB
  let start=0,last=null;
  while(start < blob.size){
    const end=Math.min(start+chunkSize,blob.size)-1;
    const chunk=blob.slice(start,end+1);
    const res=await fetch(session.uploadUrl,{
      method:"PUT",
      headers:{"Content-Length":String(chunk.size),"Content-Range":`bytes ${start}-${end}/${blob.size}`},
      body:chunk
    });
    if(!res.ok && res.status!==202) throw new Error(await res.text() || ("Upload session failed "+res.status));
    last=await res.json().catch(()=>null);
    start=end+1;
  }
  return last;
}

function dataUrlToBlob(dataUrl,mimeType){
  const parts=String(dataUrl).split(",");
  const meta=parts[0]||"";
  const b64=parts[1]||parts[0]||"";
  const mime=mimeType || (meta.match(/data:([^;]+)/)||[])[1] || "application/octet-stream";
  const byteStr=atob(b64);
  const ia=new Uint8Array(byteStr.length);
  for(let i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
  return new Blob([ia],{type:mime});
}

async function saveInspectionToOD(insp){
  await ensureODToken();
  await ensureFolder("Inspections App");
  await ensureFolder("Inspections App/photos");

  const photoCopies=[];
  for(const ph of (insp.photos||[])){
    let copy={...ph};
    if(ph.data && !ph.odUrl){
      try{
        const ext=(ph.name||"photo.jpg").split(".").pop()||"jpg";
        const filename=`${insp.id}_${ph.id||Date.now()}.${safePathName(ext)}`;
        const blob=dataUrlToBlob(ph.data,ph.mimeType);
        const uploaded=await uploadBytesToOD(`Inspections App/photos/${filename}`,blob,blob.type);
        copy.odUrl=uploaded?.webUrl || uploaded?.["@microsoft.graph.downloadUrl"] || null;
        copy.odName=filename;
      }catch(e){
        copy.odError=e.message;
      }
    }
    photoCopies.push(copy);
  }

  const odRecord={...insp,photos:photoCopies,lastSyncedAt:new Date().toISOString()};
  const filename="Inspections App/"+safePathName(insp.id)+".json";
  await odPut("/me/drive/root:/"+filename+":/content",JSON.stringify(odRecord,null,2),"application/json");
  return odRecord;
}

async function loadInspectionsFromOD(){
  await ensureODToken();
  await ensureFolder("Inspections App");
  const data=await odGet("/me/drive/root:/Inspections App:/children?$top=999");
  const files=(data.value||[]).filter(f=>f.name.endsWith(".json"));
  const results=[];
  for(const f of files){
    try{
      const res=await fetch(f["@microsoft.graph.downloadUrl"]);
      const insp=await res.json();
      results.push(insp);
    }catch{}
  }
  return results;
}

async function uploadPhotoToOD(inspId,filename,base64data,mimeType){
  await ensureODToken();
  await ensureFolder("Inspections App/photos");
  const cleanName=safePathName(inspId+"_"+filename);
  const blob=dataUrlToBlob(base64data,mimeType);
  const res=await uploadBytesToOD("Inspections App/photos/"+cleanName,blob,blob.type);
  return res?.webUrl || res?.["@microsoft.graph.downloadUrl"] || null;
}

async function exportToWord(insp,template){
  const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,
         WidthType,BorderStyle,AlignmentType,HeadingLevel,
         ShadingType,VerticalAlign,ImageRun}=docx;

  const DARK="#0f172a"; const LIGHT="#f8fafc";
  const cellShade=(color)=>({type:ShadingType.SOLID,color:color.replace("#",""),fill:color.replace("#","")});

  function hdrCell(text,opts={}){
    return new TableCell({
      shading:cellShade("0f172a"),
      verticalAlign:VerticalAlign.CENTER,
      children:[new Paragraph({
        alignment:AlignmentType.CENTER,
        children:[new TextRun({text,bold:true,color:"FFFFFF",size:18,font:"Calibri"})],
      })],
      ...opts,
    });
  }
  function dataCell(text,opts={}){
    return new TableCell({
      verticalAlign:VerticalAlign.CENTER,
      children:[new Paragraph({
        alignment:opts.center?AlignmentType.CENTER:AlignmentType.LEFT,
        children:[new TextRun({text:String(text||""),size:18,font:"Calibri"})],
      })],
      ...opts,
    });
  }
  function boldDataCell(text,opts={}){
    return new TableCell({
      shading:cellShade("f1f5f9"),
      verticalAlign:VerticalAlign.CENTER,
      children:[new Paragraph({
        children:[new TextRun({text:String(text||""),bold:true,size:18,font:"Calibri"})],
      })],
      ...opts,
    });
  }

  // Title block
  const titleTable=new Table({
    width:{size:100,type:WidthType.PERCENTAGE},
    rows:[new TableRow({children:[
      new TableCell({
        shading:cellShade("0f172a"),
        columnSpan:2,
        children:[
          new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"PORT OF CAPE TOWN",bold:true,color:"FFFFFF",size:28,font:"Calibri"})]}),
          new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"ASSET MANAGEMENT INSPECTION REPORT",bold:true,color:"7dd3fc",size:22,font:"Calibri"})]}),
          new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"AMP 206: SEWER INFRASTRUCTURE",color:"FFFFFF",size:20,font:"Calibri"})]}),
          new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"FINANCIAL YEAR 2025/26",color:"94a3b8",size:18,font:"Calibri"})]}),
          new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"ANNEXURE AMP 206_01",color:"94a3b8",size:18,font:"Calibri"})]}),
        ],
      }),
    ]}),],
  });

  // Asset details table
  const assetTable=new Table({
    width:{size:100,type:WidthType.PERCENTAGE},
    rows:[
      new TableRow({children:[
        hdrCell("ASSET DETAILS",{columnSpan:4}),
      ]}),
      new TableRow({children:[
        boldDataCell("Main Asset Group"),dataCell(template.assetGroup),
        boldDataCell("Sub Asset Group"),dataCell(template.subAssetGroup),
      ]}),
      new TableRow({children:[
        boldDataCell("Asset"),dataCell(insp.asset,{columnSpan:3}),
      ]}),
      new TableRow({children:[
        boldDataCell("Section"),dataCell(insp.section),
        boldDataCell("Date"),dataCell(insp.date),
      ]}),
    ],
  });

  // Team table
  const teamTable=new Table({
    width:{size:100,type:WidthType.PERCENTAGE},
    rows:[
      new TableRow({children:[hdrCell("INSPECTION TEAM"),hdrCell("Name"),hdrCell("Designation")]}),
      new TableRow({children:[boldDataCell("Team Leader"),dataCell(insp.teamLeader),dataCell(insp.designation)]}),
    ],
  });

  // Checklist
  const checklistRows=[
    new TableRow({children:[
      hdrCell("Item"),hdrCell("Description"),hdrCell("Yes",{width:{size:8,type:WidthType.PERCENTAGE}}),
      hdrCell("No",{width:{size:8,type:WidthType.PERCENTAGE}}),hdrCell("N/A",{width:{size:8,type:WidthType.PERCENTAGE}}),hdrCell("Comments"),
    ]}),
  ];
  let itemNum=1;
  for(const sec of template.sections){
    checklistRows.push(new TableRow({children:[
      new TableCell({shading:cellShade("1e293b"),columnSpan:6,children:[
        new Paragraph({children:[new TextRun({text:itemNum+". "+sec.title,bold:true,color:"FFFFFF",size:18,font:"Calibri"})]}),
      ]}),
    ]}));
    let subNum=1;
    for(const item of sec.items){
      const check=insp.checks?.[item.id]||{};
      checklistRows.push(new TableRow({children:[
        dataCell(itemNum+"."+subNum,{center:true,width:{size:6,type:WidthType.PERCENTAGE}}),
        dataCell(item.text),
        dataCell(check.answer==="Yes"?"✓":"",{center:true}),
        dataCell(check.answer==="No"?"✓":"",{center:true}),
        dataCell(check.answer==="N/A"?"✓":"",{center:true}),
        dataCell(check.comment||""),
      ]}));
      subNum++;
    }
    itemNum++;
  }
  const checklistTable=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:checklistRows});

  // Rating scale table
  const scaleHdrCells=[hdrCell("Rating (%)")];
  CONDITION_SCALE.forEach(c=>scaleHdrCells.push(hdrCell(c.range[0]+"-"+c.range[1])));
  const condRow=[boldDataCell("Condition")];
  CONDITION_SCALE.forEach(c=>condRow.push(dataCell(c.condition,{center:true})));
  const actionRow=[boldDataCell("Action")];
  CONDITION_SCALE.forEach(c=>actionRow.push(dataCell(c.action,{center:true})));
  const repairRow=[boldDataCell("Timeframe for Repairs")];
  CONDITION_SCALE.forEach(c=>repairRow.push(dataCell(c.repairTime,{center:true})));
  const maintRow=[boldDataCell("Timeframe for Routine Maint.")];
  CONDITION_SCALE.forEach(c=>maintRow.push(dataCell(c.maintTime,{center:true})));
  const scaleTable=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
    new TableRow({children:scaleHdrCells}),
    new TableRow({children:condRow}),
    new TableRow({children:actionRow}),
    new TableRow({children:repairRow}),
    new TableRow({children:maintRow}),
  ]});

  // Asset rating table
  const total=calcWeighted(insp.ratings,template.ratingWeights);
  const prevTotal=calcWeighted(insp.prevRatings,template.ratingWeights);
  const ratingRows=[
    new TableRow({children:[hdrCell(insp.asset||"Pump Station",{columnSpan:5})]}),
    new TableRow({children:[hdrCell("Item"),hdrCell("Weight (%)"),hdrCell("Previous Rating (%)"),hdrCell("Rating (%)"),hdrCell("Weighted Average (%)")]}),
  ];
  for(const w of template.ratingWeights){
    const val=parseFloat(insp.ratings?.[w.id]);
    const pval=parseFloat(insp.prevRatings?.[w.id]);
    const wa=!isNaN(val)?((val*w.weight)/100).toFixed(1):"";
    ratingRows.push(new TableRow({children:[
      dataCell(w.label),dataCell(w.weight+"%",{center:true}),
      dataCell(isNaN(pval)?"":pval+"%",{center:true}),
      dataCell(isNaN(val)?"":val+"%",{center:true}),
      dataCell(wa||"",{center:true}),
    ]}));
  }
  ratingRows.push(new TableRow({children:[
    boldDataCell("TOTAL"),boldDataCell("100%",{center:true}),
    boldDataCell(prevTotal!=null?prevTotal+"%":"",{center:true}),
    boldDataCell(""),
    boldDataCell(total!=null?total+"%":"",{center:true}),
  ]}));
  const ratingTable=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:ratingRows});

  // Photos table
  const photoRows=[new TableRow({children:[hdrCell("No.",{width:{size:6,type:WidthType.PERCENTAGE}}),hdrCell("Photos"),hdrCell("Comments")]})];
  const photos=insp.photos||[];
  for(let i=0;i<photos.length;i++){
    const ph=photos[i];
    let imgRun=null;
    try{
      const base64=ph.data.split(",")[1];
      const buf=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
      imgRun=new ImageRun({data:buf,transformation:{width:180,height:120},type:"jpg"});
    }catch{}
    photoRows.push(new TableRow({children:[
      dataCell(String(i+1),{center:true,width:{size:6,type:WidthType.PERCENTAGE}}),
      new TableCell({children:[
        imgRun?new Paragraph({children:[imgRun]}):new Paragraph({children:[new TextRun({text:"[Image]",color:"94a3b8",size:16})]}),
        ph.geo?new Paragraph({children:[new TextRun({text:"📍 "+ph.geo,size:14,color:"64748b"})]}):new Paragraph({children:[]}),
      ]}),
      dataCell(ph.comment||""),
    ]}));
  }
  if(photos.length===0){
    photoRows.push(new TableRow({children:[dataCell("—",{center:true,columnSpan:3})]}));
  }
  const photosTable=new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:photoRows});

  // Sign-off table
  const signoffTable=new Table({
    width:{size:100,type:WidthType.PERCENTAGE},
    rows:[new TableRow({children:[
      boldDataCell("Compiled by:"),dataCell(insp.teamLeader||""),
      boldDataCell("Date:"),dataCell(insp.date||""),
    ]})],
  });

  function sp(){return new Paragraph({children:[new TextRun({text:"",size:16})]});}
  function heading(text){return new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text,bold:true,size:22,font:"Calibri",color:"0f172a"})]});}

  const doc=new Document({
    styles:{paragraphStyles:[{id:"Normal",name:"Normal",run:{font:"Calibri",size:18}}]},
    sections:[{
      properties:{page:{margin:{top:720,right:720,bottom:720,left:720}}},
      children:[
        titleTable,sp(),
        heading("ANNEXURE AMP 206_01: ASSET INSPECTION REPORT"),sp(),
        assetTable,sp(),
        teamTable,sp(),
        heading("INSPECTION CHECKLIST"),sp(),
        checklistTable,sp(),
        heading("CONDITION RATING"),sp(),
        new Paragraph({children:[new TextRun({text:"Table 1: General Rating Scale",bold:true,size:18,font:"Calibri"})]}),sp(),
        scaleTable,sp(),
        new Paragraph({children:[new TextRun({text:"Table 2: Asset Rating — "+template.subAssetGroup,bold:true,size:18,font:"Calibri"})]}),sp(),
        ratingTable,sp(),
        new Paragraph({children:[new TextRun({text:"Note: Condition Rating to be carried over to the summary report.",italics:true,size:16,font:"Calibri",color:"64748b"})]}),sp(),
        heading("PHOTO CONDITION ASSESSMENT"),sp(),
        new Paragraph({children:[new TextRun({text:"The condition inspection and assessment indicated below was conducted in "+(insp.date||""),size:18,font:"Calibri"})]}),sp(),
        photosTable,sp(),
        heading("INSPECTION SIGN OFF"),sp(),
        signoffTable,
      ],
    }],
  });

  const blob=await Packer.toBlob(doc);
  const fname="AMP206_"+( insp.asset||"Inspection").replace(/\s+/g,"_")+"_"+( insp.date||"").replace(/-/g,"")+" .docx";
  saveAs(blob,fname);
}

// ── UI primitives ──────────────────────────────────────────────
function Btn({children,onClick,cls="btn-primary",sm,disabled,style:sx={}}){

}
function Field({label,value,onChange,readOnly,placeholder,type="text",cls=""}){

function RadioPill({value,onChange,disabled}){

    <div className="radio-group">
      {["Yes","No","N/A"].map(opt=>(

}
function Badge({color,children}){
  return <span className="badge" style={{background:color+"22",color,border:"1px solid "+color+"55"}}>{children}</span>;
}
function Toast({msg,type}){
  if(!msg)return null;
  const colors={success:"#15803d",error:"#dc2626",info:"#2563eb",loading:"#7c3aed"};
  const icon=type==="loading"?"⏳":type==="success"?"✓":type==="error"?"✕":"ℹ";
  return <div className="toast" style={{borderColor:colors[type]||"#334155"}}>
    <span style={{color:colors[type]||"#f1f5f9"}}>{icon}</span>{msg}
  </div>;
}

// ── Photo Section ──────────────────────────────────────────────
function PhotoSection({photos=[],onChange,readOnly,inspId}){
  const fileRef=useRef();
  const [geoLoading,setGeoLoading]=useState(false);

  function getGeo(){
    return new Promise((res)=>{
      if(!navigator.geolocation){res(null);return;}
      navigator.geolocation.getCurrentPosition(
        p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
        ()=>res(null),{timeout:8000}
      );
    });
  }

  async function handleFiles(files){
    setGeoLoading(true);
    const geo=await getGeo();
    setGeoLoading(false);
    const newPhotos=[...photos];
    for(const file of Array.from(files)){
      const reader=new FileReader();
      await new Promise(res=>{reader.onload=e=>{
        newPhotos.push({
          id:uid(),
          name:file.name,
          data:e.target.result,
          geo:geo?fmtCoord(geo.lat,geo.lng):null,
          geoAcc:geo?geo.acc:null,
          comment:"",
          timestamp:new Date().toISOString(),
        });
        res();
      };reader.readAsDataURL(file);});
    }
    onChange(newPhotos);
  }

  function updateComment(id,val){
    onChange(photos.map(p=>p.id===id?{...p,comment:val}:p));
  }
  function updateGeo(id,val){
    onChange(photos.map(p=>p.id===id?{...p,geo:val}:p));
  }
  function removePhoto(id){
    onChange(photos.filter(p=>p.id!==id));
  }
  function refreshGeo(id){
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(pos=>{
      const geo=fmtCoord(pos.coords.latitude,pos.coords.longitude);
      updateGeo(id,geo);
    },()=>{});
  }

  return(
    <div className="card">
      <div className="card-header">
        PHOTO CONDITION ASSESSMENT
        {!readOnly&&<Btn sm cls="btn-primary" onClick={()=>fileRef.current.click()} disabled={geoLoading}>
          {geoLoading?"Getting location…":"+ Add Photos"}
        </Btn>}
      </div>
      {/* Accept both camera and file picker on mobile; file picker on desktop */}
      <input ref={fileRef} type="file" accept="image/*" multiple
        style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
      <div style={{padding:14}}>
        {photos.length===0&&<div style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:"20px 0"}}>No photos yet. Tap + Add Photos to select from files or camera.</div>}
        {photos.map((ph,i)=>(
          <div key={ph.id} style={{border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden",marginBottom:10}}>
            <div style={{display:"flex",gap:10,padding:10}}>
              <div style={{flexShrink:0,width:100,height:80,borderRadius:6,overflow:"hidden",background:"#f1f5f9"}}>
                <img src={ph.data} alt={ph.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              </div>
              <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
                <div style={{fontSize:11,fontWeight:700,color:"#334155"}}>Photo {i+1}: {ph.name}</div>
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,color:"#64748b"}}>📍</span>
                  <input type="text" value={ph.geo||""} onChange={e=>updateGeo(ph.id,e.target.value)}
                    placeholder="Coordinates (auto or enter manually)"
                    style={{flex:1,padding:"4px 8px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:12,outline:"none",minWidth:0}}
                    readOnly={readOnly}/>
                  {!readOnly&&<button onClick={()=>refreshGeo(ph.id)} style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>📡 Update</button>}
                </div>
                {ph.geoAcc&&<div style={{fontSize:10,color:"#94a3b8"}}>Accuracy: ±{Math.round(ph.geoAcc)}m</div>}
                <input type="text" value={ph.comment||""} onChange={e=>updateComment(ph.id,e.target.value)}
                  placeholder="Photo comment / description"
                  style={{padding:"5px 8px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13,outline:"none"}}
                  readOnly={readOnly}/>
              </div>
              {!readOnly&&<button onClick={()=>removePhoto(ph.id)} style={{background:"none",border:"none",color:"#cbd5e1",fontSize:18,cursor:"pointer",alignSelf:"flex-start"}}>🗑</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

                  <tr style={{background:"#f8fafc"}}>
                    {["Item","Weight","Prev. Rating (%)","Rating (%)","Weighted Avg"].map(h=>(
                      <th key={h} style={{padding:"8px 10px",textAlign:"left",borderBottom:"1px solid #e2e8f0",color:"#64748b",fontSize:11,fontWeight:700}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {template.ratingWeights.map(w=>{
                    const val=parseFloat(insp.ratings?.[w.id]);
                    const pval=parseFloat(insp.prevRatings?.[w.id]);
                    const wa=!isNaN(val)?((val*w.weight)/100).toFixed(1):"";
                    return(
                      <tr key={w.id} style={{borderBottom:"1px solid #f1f5f9"}}>
                        <td style={{padding:"8px 10px",color:"#1e293b"}}>{w.label}</td>
                        <td style={{padding:"8px 10px",color:"#64748b"}}>{w.weight}%</td>
                        <td style={{padding:"8px 10px"}}>
                          {ro?<span style={{color:"#64748b"}}>{isNaN(pval)?"—":pval+"%"}</span>
                            :<input type="number" min="0" max="100" value={insp.prevRatings?.[w.id]||""}
                              onChange={e=>setPrevRating(w.id,e.target.value)}
                              placeholder="prev"
                              style={{width:64,padding:"4px 7px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:13,outline:"none",fontFamily:"inherit"}}/>}
                        </td>
                        <td style={{padding:"8px 10px"}}>
                          {ro?<span>{insp.ratings?.[w.id]||"—"}</span>
                            :<input type="number" min="0" max="100" value={insp.ratings?.[w.id]||""}
                              onChange={e=>setRating(w.id,e.target.value)}
                              style={{width:64,padding:"4px 7px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:13,outline:"none",fontFamily:"inherit"}}/>}
                        </td>
                        <td style={{padding:"8px 10px",color:"#64748b"}}>{wa||"—"}</td>
                      </tr>
                    );
                  })}
                  <tr style={{background:"#f8fafc",fontWeight:700}}>
                    <td style={{padding:"8px 10px",color:"#0f172a"}}>TOTAL</td>
                    <td style={{padding:"8px 10px"}}>100%</td>
                    <td style={{padding:"8px 10px",color:"#64748b"}}>{prevTotal!=null?prevTotal+"%":"—"}</td>
                    <td></td>
                    <td style={{padding:"8px 10px"}}>
                      {total!=null?<span style={{color:cond?.color||"#1e293b",fontWeight:800,fontSize:16}}>{total}%</span>:"—"}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            {cond&&<div style={{padding:"10px 14px",background:cond.color+"11",borderTop:"1px solid "+cond.color+"33",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
              <Badge color={cond.color}>{cond.condition}</Badge>
              <span style={{fontSize:12,color:"#475569"}}>{cond.action}</span>
              <span style={{fontSize:11,color:"#94a3b8"}}>Repairs: {cond.repairTime}</span>
            </div>}
          </div>
          {/* Rating scale reference */}
          <div className="card">
            <div className="card-header">GENERAL RATING SCALE REFERENCE</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:600}}>
                <thead><tr style={{background:"#0f172a"}}>
                  {["Rating %","Condition","Action","Repair Time","Maint. Time"].map(h=>(
                    <th key={h} style={{padding:"7px 10px",color:"#f1f5f9",fontWeight:700,textAlign:"left"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {CONDITION_SCALE.map((c,i)=>(
                    <tr key={i} style={{background:i%2===0?"#f8fafc":"#fff",borderBottom:"1px solid #e2e8f0"}}>
                      <td style={{padding:"6px 10px",fontWeight:700,color:c.color}}>{c.range[0]}-{c.range[1]}</td>
                      <td style={{padding:"6px 10px",color:c.color,fontWeight:600}}>{c.condition}</td>
                      <td style={{padding:"6px 10px",color:"#475569"}}>{c.action}</td>
                      <td style={{padding:"6px 10px",color:"#64748b"}}>{c.repairTime}</td>
                      <td style={{padding:"6px 10px",color:"#64748b"}}>{c.maintTime}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>}

        {/* PHOTOS TAB */}
        {tab==="photos"&&
          <PhotoSection photos={insp.photos||[]} onChange={v=>set("photos",v)} readOnly={ro} inspId={insp.id}/>
        }
      </div>
    </div>
  );
}

// ── Root App ───────────────────────────────────────────────────
function App(){
  const [inspections,setInspections]=useState([]);
  const [odConfig,setOdConfig]=useState(null);
  const [odConnected,setOdConnected]=useState(false);
  const [view,setView]=useState("list");
  const [current,setCurrent]=useState(null);
  const [readOnly,setReadOnly]=useState(false);
  const [saving,setSaving]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"info"});
  const [sortBy,setSortBy]=useState("date");
  const [groupBy,setGroupBy]=useState("none");
  const [filterInspector,setFilterInspector]=useState("");
  const tmpl=DEFAULT_TEMPLATE;

  useEffect(()=>{
    setInspections(lsGet(INSPECTIONS_KEY,[]));
    const cfg=lsGet(OD_CONFIG_KEY,null);
    if(cfg){setOdConfig(cfg);_odConfig=cfg;}
  },[]);

  useEffect(()=>{
    const back=()=>setView("list");
    const edit=()=>setReadOnly(false);
    window.addEventListener("navBack",back);
    window.addEventListener("editInsp",edit);
    return()=>{window.removeEventListener("navBack",back);window.removeEventListener("editInsp",edit);};
  },[]);

  function showToast(msg,type="info",dur=3500){
    setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"info"}),dur);
  }
  function persist(list){setInspections(list);lsSet(INSPECTIONS_KEY,list);}

  function startNew(){
    setCurrent({
      id:"insp_"+Date.now(),createdAt:new Date().toISOString(),
      templateId:tmpl.id,templateName:tmpl.name,
      asset:"",teamLeader:"",designation:"",
      date:new Date().toISOString().slice(0,10),
      section:"",financialYear:"2025/26",
      checks:emptyChecks(tmpl),ratings:emptyRatings(tmpl),
      prevRatings:emptyPrevRatings(tmpl),
      photos:[],signedOff:false,
    });
    setReadOnly(false);setView("form");
  }

  function openInspection(insp){setCurrent({...insp});setReadOnly(true);setView("form");}

  async function saveInspection(){
    setSaving(true);
    const upd={...current};
    const list=[upd,...inspections.filter(i=>i.id!==current.id)];
    persist(list);
    setCurrent(upd);
    if(odConfig&&_odToken){
      try{await saveInspectionToOD(upd);showToast("Saved to OneDrive ✓","success");}
      catch(e){showToast("Saved locally. OneDrive: "+e.message,"error");}
    }else{
      showToast("Saved locally ✓","success");
    }
    setSaving(false);
  }

  async function submitInspection(){
    const upd={...current,signedOff:true,signedAt:new Date().toISOString()};
    const list=[upd,...inspections.filter(i=>i.id!==current.id)];
    persist(list);
    if(odConfig&&_odToken){try{await saveInspectionToOD(upd);}catch{}}
    showToast("Signed off ✓","success");setView("list");
  }

  async function pullOD(){
    if(!odConfig){showToast("OneDrive not configured","error");return;}
    if(!_odToken){
      showToast("Signing in to OneDrive…","loading",8000);
      try{await odSignIn(odConfig);setOdConnected(true);}
      catch(e){showToast("Sign in failed: "+e.message,"error");return;}
    }
    setSyncing(true);showToast("Pulling from OneDrive…","loading",10000);
    try{
      const remote=await loadInspectionsFromOD();
      const lm=Object.fromEntries(inspections.map(i=>[i.id,i]));
      const rm=Object.fromEntries(remote.map(i=>[i.id,i]));
      persist(Object.values({...lm,...rm}));
      showToast("Synced "+remote.length+" inspection(s) ✓","success");
    }catch(e){showToast("Sync failed: "+e.message,"error");}
    setSyncing(false);
  }

  async function signInOD(){
    if(!odConfig)return;
    showToast("Opening OneDrive sign-in…","loading",8000);
    try{await odSignIn(odConfig);setOdConnected(true);showToast("OneDrive connected ✓","success");}
    catch(e){showToast("Sign in failed: "+e.message,"error");}
  }

  async function handleExport(){
    try{
      showToast("Generating Word document…","loading",8000);
      await exportToWord(current,tmpl);
      showToast("Word document downloaded ✓","success");
    }catch(e){showToast("Export failed: "+e.message,"error");}
  }

  function deleteInsp(id){if(confirm("Delete this inspection?"))persist(inspections.filter(i=>i.id!==id));}

  // ── Sorting & Grouping ──
  const sortOptions=[
    {key:"date",label:"Date"},
    {key:"inspector",label:"Inspector"},
    {key:"asset",label:"Asset"},
    {key:"rating",label:"Rating"},
    {key:"status",label:"Status"},
  ];
  const groupOptions=[
    {key:"none",label:"No Grouping"},
    {key:"inspector",label:"By Inspector"},
    {key:"section",label:"By Section"},
    {key:"status",label:"By Status"},
    {key:"date",label:"By Month"},
  ];

  function sortedInspections(){
    let list=[...inspections];
    if(filterInspector)list=list.filter(i=>(i.teamLeader||"").toLowerCase().includes(filterInspector.toLowerCase()));
    list.sort((a,b)=>{
      if(sortBy==="date") return (b.date||"").localeCompare(a.date||"");
      if(sortBy==="inspector") return (a.teamLeader||"").localeCompare(b.teamLeader||"");
      if(sortBy==="asset") return (a.asset||"").localeCompare(b.asset||"");
      if(sortBy==="rating"){
        const ra=calcWeighted(a.ratings,tmpl.ratingWeights)||0;
        const rb=calcWeighted(b.ratings,tmpl.ratingWeights)||0;
        return rb-ra;
      }
      if(sortBy==="status") return (b.signedOff?1:0)-(a.signedOff?1:0);
      return 0;
    });
    return list;
  }

  function groupedInspections(){
    const list=sortedInspections();
    if(groupBy==="none") return [["",list]];
    const map=new Map();
    list.forEach(insp=>{
      let key="";
      if(groupBy==="inspector") key=insp.teamLeader||"Unknown";
      else if(groupBy==="section") key=insp.section||"No Section";
      else if(groupBy==="status") key=insp.signedOff?"Signed Off":"Draft";
      else if(groupBy==="date") key=insp.date?(insp.date.slice(0,7)):("No Date");
      if(!map.has(key))map.set(key,[]);
      map.get(key).push(insp);
    });
    return Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  }

  // ── VIEWS ──
  if(view==="odSetup") return <ODSetup onSave={cfg=>{lsSet(OD_CONFIG_KEY,cfg);setOdConfig(cfg);_odConfig=cfg;setView("list");showToast("OneDrive configured ✓","success");}} onSkip={()=>setView("list")}/>;

  if(view==="form") return(
    <>
      <InspectionForm
        inspection={current} template={tmpl}
        readOnly={readOnly} onUpdate={setCurrent}
        onSave={saveInspection} onSubmit={submitInspection}
        onExport={handleExport} saving={saving}
      />
      <Toast {...toast}/>
    </>
  );

  // ── LIST VIEW ──
  const groups=groupedInspections();
  const allInspectors=[...new Set(inspections.map(i=>i.teamLeader).filter(Boolean))];

  return(
    <div style={{fontFamily:"system-ui,sans-serif",background:"#f0f4f8",minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:"#0f172a",padding:"16px 14px"}}>
        <div style={{color:"#94a3b8",fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:4}}>Asset Management · AMP 206</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <h1 style={{color:"#f1f5f9",margin:0,fontSize:18,fontWeight:700}}>Sewer Inspections</h1>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
            {!odConfig
              ?<Btn sm cls="btn-orange" onClick={()=>setView("odSetup")}>☁️ OneDrive</Btn>
              :!odConnected
                ?<Btn sm cls="btn-dark" onClick={signInOD}>☁️ Sign In</Btn>
                :<Btn sm cls="btn-dark" onClick={pullOD} disabled={syncing}>{syncing?"…":"↓ Sync"}</Btn>
            }
            <Btn sm cls="btn-primary" onClick={startNew}>+ New</Btn>
          </div>
        </div>
        {odConfig&&(
          <div className="od-bar">
            <span style={{fontSize:11,color:odConnected?"#86efac":"#fbbf24"}}>{odConnected?"● OneDrive connected":"● OneDrive configured — tap Sign In"}</span>
            <button onClick={()=>{lsSet(OD_CONFIG_KEY,null);setOdConfig(null);setOdConnected(false);showToast("Disconnected","info");}} style={{background:"none",border:"none",color:"#64748b",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>Disconnect</button>
          </div>
        )}
      </div>

      <div style={{padding:"14px"}}>
        {/* Sort & Group */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-header">SORT & FILTER</div>
          <div className="card-body" style={{display:"flex",flexDirection:"column",gap:10}}>
            <div>
              <div className="field-label" style={{marginBottom:6}}>Sort by</div>
              <div className="sort-bar" style={{marginBottom:0}}>
                {sortOptions.map(o=><span key={o.key} className={"sort-pill"+(sortBy===o.key?" active":"")} onClick={()=>setSortBy(o.key)}>{o.label}</span>)}
              </div>
            </div>
            <div>
              <div className="field-label" style={{marginBottom:6}}>Group by</div>
              <div className="sort-bar" style={{marginBottom:0}}>
                {groupOptions.map(o=><span key={o.key} className={"sort-pill"+(groupBy===o.key?" active":"")} onClick={()=>setGroupBy(o.key)}>{o.label}</span>)}
              </div>
            </div>
            <div>
              <div className="field-label" style={{marginBottom:4}}>Filter by inspector</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <input type="text" value={filterInspector} onChange={e=>setFilterInspector(e.target.value)}
                  placeholder="Type inspector name…"
                  style={{flex:1,padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:7,fontSize:13,outline:"none",minWidth:120}}/>
                {allInspectors.map(n=>(
                  <span key={n} className={"sort-pill"+(filterInspector===n?" active":"")} onClick={()=>setFilterInspector(filterInspector===n?"":n)} style={{cursor:"pointer"}}>{n}</span>
                ))}
              </div>
            </div>
          </div>
        </div>

        {inspections.length===0?(
          <div style={{textAlign:"center",color:"#94a3b8",padding:"60px 0",fontSize:14}}>
            <div style={{fontSize:40,marginBottom:12}}>📋</div>
            No inspections yet.<br/>Tap <strong>+ New</strong> to start.
          </div>
        ):(
          groups.map(([groupKey,items])=>(
            <div key={groupKey}>
              {groupBy!=="none"&&<div className="group-header">{groupKey} ({items.length})</div>}
              {items.map(insp=>{
                const total=calcWeighted(insp.ratings,tmpl.ratingWeights);
                const prevTotal=calcWeighted(insp.prevRatings,tmpl.ratingWeights);
                const cond=getCondition(total);
                const filled=Object.values(insp.checks||{}).filter(c=>c.answer).length;
                const totalItems=Object.keys(insp.checks||{}).length;
                return(
                  <div key={insp.id} className="insp-card" onClick={()=>openInspection(insp)}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,color:"#0f172a",fontSize:14}}>{insp.asset||"Untitled"}</span>
                        {insp.signedOff?<Badge color="#16a34a">Done</Badge>:<Badge color="#ca8a04">Draft</Badge>}
                        {(insp.photos||[]).length>0&&<Badge color="#7c3aed">📷 {insp.photos.length}</Badge>}
                      </div>
                      <div style={{color:"#64748b",fontSize:12,display:"flex",gap:8,flexWrap:"wrap"}}>
                        <span>📅 {insp.date||"—"}</span>
                        <span>👤 {insp.teamLeader||"—"}</span>
                        {insp.section&&<span>📍 {insp.section}</span>}
                        <span>{filled}/{totalItems} items</span>
                      </div>
                      {prevTotal!=null&&<div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>Prev: {prevTotal}%</div>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      {total!=null&&<div style={{textAlign:"center"}}>
                        <div style={{fontSize:20,fontWeight:800,color:cond?.color||"#1e293b"}}>{total}%</div>
                        <div style={{fontSize:9,color:"#94a3b8"}}>{cond?.condition}</div>
                      </div>}
                      <button onClick={e=>{e.stopPropagation();deleteInsp(insp.id);}} style={{background:"none",border:"none",color:"#cbd5e1",fontSize:16,cursor:"pointer",padding:4}}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>
          ))
        )}
      </div>
      <Toast {...toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js")
    .then(r=>console.log("SW registered",r.scope))
    .catch(e=>console.warn("SW failed",e));
}
</script>
</body>
