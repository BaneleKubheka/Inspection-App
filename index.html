function uid(){return Math.random().toString(36).slice(2,9);}
function getCondition(s){if(s==null||isNaN(s))return null;return CONDITION_SCALE.find(c=>s>=c.range[0]&&s<=c.range[1])||null;}
function calcWeighted(ratings,weights){let n=0,d=0;for(const w of weights){const v=parseFloat(ratings?.[w.id]);if(!isNaN(v)){n+=v*w.weight;d+=w.weight;}}return d?Math.round(n/d):null;}
function emptyChecks(t){const c={};t.sections.forEach(s=>s.items.forEach(i=>{c[i.id]={answer:"",comment:""};}));return c;}
function emptyRatings(t){const r={};t.ratingWeights.forEach(w=>{r[w.id]="";});return r;}
function emptyPrevRatings(t){const r={};t.ratingWeights.forEach(w=>{r[w.id]="";});return r;}
function normalizeTemplate(t){
  const base=DEFAULT_TEMPLATE;
  const nt={...base,...t};
  nt.sections=(nt.sections&&nt.sections.length?nt.sections:base.sections).map((s,si)=>({
    id:s.id||("s"+(si+1)),
    title:s.title||("SECTION "+(si+1)),
    items:(s.items&&s.items.length?s.items:[]).map((it,ii)=>({id:it.id||("s"+(si+1)+"i"+(ii+1)),text:it.text||"Checklist item"}))
  }));
  nt.ratingWeights=(nt.ratingWeights&&nt.ratingWeights.length?nt.ratingWeights:base.ratingWeights).map((w,i)=>({
    id:w.id||("rw"+(i+1)),label:w.label||("Rating item "+(i+1)),weight:Number(w.weight)||0
  }));
  return nt;
}
function loadTemplates(){
  const saved=lsGet(TEMPLATES_KEY,null);
  if(!saved||!Array.isArray(saved)||!saved.length)return [normalizeTemplate(DEFAULT_TEMPLATE)];
  return saved.map(normalizeTemplate);
}
function saveTemplates(v){lsSet(TEMPLATES_KEY,v.map(normalizeTemplate));}
function cloneTemplate(t){return JSON.parse(JSON.stringify(t));}
function migrateInspectionForTemplate(insp,t){
  return {...insp,templateId:t.id,templateName:t.name,financialYear:insp.financialYear||t.financialYear||"",checks:{...emptyChecks(t),...(insp.checks||{})},ratings:{...emptyRatings(t),...(insp.ratings||{})},prevRatings:{...emptyPrevRatings(t),...(insp.prevRatings||{})}};
}
function lsGet(k,fb){try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb;}catch{return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function fmtCoord(lat,lng){if(lat==null)return"";return lat.toFixed(5)+"°, "+lng.toFixed(5)+"°";}

// ═══════════════════════════════════════════════════════════════
// ONEDRIVE (Microsoft Graph API)
// Uses MSAL popup login. No od_redirect.html file is required.
// Your Azure App Registration redirect URI must be the deployed site origin,
// e.g. https://your-project.pages.dev or https://username.github.io/repo-name.

let _odToken=null;
let _odConfig=null;
let _msalInstance=null;
let _odAccount=null;
let _msalLoadPromise=null;

function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const existing=[...document.scripts].find(s=>s.src===src);
    if(existing){
      if(existing.dataset.loaded==="true") return resolve();
      existing.addEventListener("load",()=>resolve(),{once:true});
      existing.addEventListener("error",()=>reject(new Error("Failed to load "+src)),{once:true});
      return;
    }
    const script=document.createElement("script");
    script.src=src;
    script.async=true;
    script.onload=()=>{script.dataset.loaded="true";resolve();};
    script.onerror=()=>reject(new Error("Failed to load "+src));
    document.head.appendChild(script);
  });
}

async function ensureMsalLoaded(){
  if(window.msal?.PublicClientApplication) return window.msal;
  if(!_msalLoadPromise){
    _msalLoadPromise=(async()=>{
      const sources=[
        "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js",
        "https://unpkg.com/@azure/msal-browser@2.38.3/lib/msal-browser.min.js",
        "https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
      ];
      let lastErr=null;
      for(const src of sources){
        try{
          await loadScriptOnce(src);
          if(window.msal?.PublicClientApplication) return window.msal;
        }catch(e){lastErr=e;}
      }
      throw new Error("MSAL could not load. Check your internet connection, browser extensions, or network firewall. "+(lastErr?.message||""));
    })();
  }
  return _msalLoadPromise;
}

function odAuthority(cfg){
  return cfg?.personal ? "https://login.microsoftonline.com/consumers" : "https://login.microsoftonline.com/organizations";
}

function getMsal(cfg){
  if(!window.msal?.PublicClientApplication) throw new Error("MSAL is not loaded yet. Try again after the page finishes loading.");
  if(!cfg?.clientId || cfg.clientId === "YOUR_CLIENT_ID") throw new Error("Enter your real Microsoft Application (Client) ID first.");
  const key = JSON.stringify({clientId:cfg.clientId,personal:!!cfg.personal,origin:window.location.origin});
  if(_msalInstance && _msalInstance.__key === key) return _msalInstance;
  _msalInstance = new window.msal.PublicClientApplication({
    auth:{
      clientId:cfg.clientId,
      authority:odAuthority(cfg),
      redirectUri:window.location.origin,
      postLogoutRedirectUri:window.location.origin,
    },
    cache:{
      cacheLocation:"localStorage",
      storeAuthStateInCookie:false,
    },
    system:{
      allowNativeBroker:false,
    }
  });
  _msalInstance.__key = key;
  return _msalInstance;
}

async function odSignIn(cfg){
  _odConfig=cfg;
  await ensureMsalLoaded();
  const app=getMsal(cfg);
  const scopes=["Files.ReadWrite","User.Read"];
  const existing=app.getAllAccounts();
  if(existing.length){
    _odAccount=existing[0];
    try{
      const silent=await app.acquireTokenSilent({scopes,account:_odAccount});
      _odToken=silent.accessToken;
      return _odToken;
    }catch(e){}
  }
  const login=await app.loginPopup({scopes,prompt:"select_account"});
  _odAccount=login.account;
  _odToken=login.accessToken;
  if(!_odToken){
    const token=await app.acquireTokenSilent({scopes,account:_odAccount});
    _odToken=token.accessToken;
  }
  if(!_odToken) throw new Error("Microsoft login completed, but no OneDrive token was returned.");
  return _odToken;
}

async function ensureODToken(){
  if(_odToken) return _odToken;
  if(!_odConfig) throw new Error("OneDrive is not configured.");
  return odSignIn(_odConfig);
}

function graphPath(path){
  return "https://graph.microsoft.com/v1.0"+path;
}

async function odFetch(path,opts={}){
  await ensureODToken();
  const headers={...(opts.headers||{}),Authorization:"Bearer "+_odToken};
  const res=await fetch(graphPath(path),{...opts,headers});
  if(res.status===401){
    _odToken=null;
    await ensureODToken();
    headers.Authorization="Bearer "+_odToken;
    const retry=await fetch(graphPath(path),{...opts,headers});
    if(!retry.ok) throw new Error(await retry.text() || ("OneDrive error "+retry.status));
    return retry;
  }
  if(!res.ok) throw new Error(await res.text() || ("OneDrive error "+res.status));
  return res;
}

async function odGet(path){
  const res=await odFetch(path);
  return res.json();
}
async function odPut(path,data,contentType){
  const res=await odFetch(path,{
    method:"PUT",headers:{"Content-Type":contentType||"application/octet-stream"},body:data
  });
  return res.json();
}
async function odPost(path,body){
  const res=await odFetch(path,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  });
  return res.json();
}

function safePathName(name){
  return String(name||"file").replace(/[\\/:*?"<>|#%{}~&]/g,"_").slice(0,120);
}

async function ensureFolder(folderPath){
  const parts=folderPath.split("/").filter(Boolean);
  let current="";
  for(const part of parts){
    const parent=current;
    current=current?current+"/"+part:part;
    try{
      await odGet("/me/drive/root:/"+encodeURIComponent(current).replace(/%2F/g,"/"));
    }catch{
      const endpoint=parent?"/me/drive/root:/"+encodeURIComponent(parent).replace(/%2F/g,"/")+":/children":"/me/drive/root/children";
      await odPost(endpoint,{name:part,folder:{},"@microsoft.graph.conflictBehavior":"replace"});
    }
  }
}

async function uploadBytesToOD(remotePath,blob,contentType){
  const cleanPath=remotePath.split("/").map(safePathName).join("/");
  // Simple upload is reliable up to 4 MB. Use upload session for anything larger.
  if(blob.size <= 4*1024*1024){
    return odPut("/me/drive/root:/"+cleanPath+":/content",blob,contentType||blob.type||"application/octet-stream");
  }
  const session=await odPost("/me/drive/root:/"+cleanPath+":/createUploadSession",{
    item:{"@microsoft.graph.conflictBehavior":"replace",name:cleanPath.split("/").pop()}
  });
  const chunkSize=320*1024*10; // must be a multiple of 320 KiB
  let start=0,last=null;
  while(start < blob.size){
    const end=Math.min(start+chunkSize,blob.size)-1;
    const chunk=blob.slice(start,end+1);
    const res=await fetch(session.uploadUrl,{
      method:"PUT",
      headers:{"Content-Length":String(chunk.size),"Content-Range":`bytes ${start}-${end}/${blob.size}`},
      body:chunk
    });
    if(!res.ok && res.status!==202) throw new Error(await res.text() || ("Upload session failed "+res.status));
    last=await res.json().catch(()=>null);
    start=end+1;
  }
  return last;
}

function dataUrlToBlob(dataUrl,mimeType){
  const parts=String(dataUrl).split(",");
  const meta=parts[0]||"";
  const b64=parts[1]||parts[0]||"";
  const mime=mimeType || (meta.match(/data:([^;]+)/)||[])[1] || "application/octet-stream";
  const byteStr=atob(b64);
  const ia=new Uint8Array(byteStr.length);
  for(let i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
  return new Blob([ia],{type:mime});
}

async function saveInspectionToOD(insp){
  await ensureODToken();
  await ensureFolder("Inspections App");
  await ensureFolder("Inspections App/photos");

  const photoCopies=[];
  for(const ph of (insp.photos||[])){
    let copy={...ph};
    if(ph.data && !ph.odUrl){
      try{
        const ext=(ph.name||"photo.jpg").split(".").pop()||"jpg";
        const filename=`${insp.id}_${ph.id||Date.now()}.${safePathName(ext)}`;
        const blob=dataUrlToBlob(ph.data,ph.mimeType);
        const uploaded=await uploadBytesToOD(`Inspections App/photos/${filename}`,blob,blob.type);
        copy.odUrl=uploaded?.webUrl || uploaded?.["@microsoft.graph.downloadUrl"] || null;
        copy.odName=filename;
      }catch(e){
        copy.odError=e.message;
      }
    }
    photoCopies.push(copy);
  }

  const odRecord={...insp,photos:photoCopies,lastSyncedAt:new Date().toISOString()};
  const filename="Inspections App/"+safePathName(insp.id)+".json";
  await odPut("/me/drive/root:/"+filename+":/content",JSON.stringify(odRecord,null,2),"application/json");
  return odRecord;
}

async function loadInspectionsFromOD(){
  await ensureODToken();
  await ensureFolder("Inspections App");
  const data=await odGet("/me/drive/root:/Inspections App:/children?$top=999");
  const files=(data.value||[]).filter(f=>f.name.endsWith(".json"));
  const results=[];
  for(const f of files){
    try{
      const res=await fetch(f["@microsoft.graph.downloadUrl"]);
      const insp=await res.json();
      results.push(insp);
    }catch{}
  }
  return results;
}

async function uploadPhotoToOD(inspId,filename,base64data,mimeType){
  await ensureODToken();
  await ensureFolder("Inspections App/photos");
  const cleanName=safePathName(inspId+"_"+filename);
  const blob=dataUrlToBlob(base64data,mimeType);
  const res=await uploadBytesToOD("Inspections App/photos/"+cleanName,blob,blob.type);
  return res?.webUrl || res?.["@microsoft.graph.downloadUrl"] || null;
}

async function exportToWord(insp,template){
  const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,
         WidthType,BorderStyle,AlignmentType,HeadingLevel,
         ShadingType,VerticalAlign,ImageRun,Header,Footer,PageNumber}=docx;

  const GREY="D9D9D9";
  const BORDER={style:BorderStyle.SINGLE,size:6,color:"000000"};
  const borders={top:BORDER,bottom:BORDER,left:BORDER,right:BORDER};
  const pageFile=(insp.id||"inspection")+".docx";
  const reportTitle=template.reportTitle||"PORT OF CAPE TOWN ASSET MANAGEMENT INSPECTION REPORT:";
  const reportCode=template.reportCode||template.name||"ASSET INSPECTION";
  const fy=insp.financialYear||template.financialYear||"2025/26";
  const annexure=template.annexure||"ANNEXURE AMP 206_01";
  const docTitle=template.documentTitle||"ANNEXURE AMP 206_01: ASSET INSPECTION REPORT";

  function p(text,opts={}){return new Paragraph({alignment:opts.align,spacing:opts.spacing||{after:0},children:[new TextRun({text:String(text||""),bold:!!opts.bold,italics:!!opts.italics,underline:opts.underline?{}:undefined,size:opts.size||20,font:"Arial",color:opts.color||"000000"})]});}

  children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:scaleRows}));

  (insp.photos||[]).forEach((ph,i)=>{
    let img=null;
    try{const base64=ph.data.split(",")[1];const buf=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));img=new ImageRun({data:buf,transformation:{width:230,height:155},type:"jpg"});}catch{}
    photoRows.push(new TableRow({children:[txtCell(String(i+1),{center:true}),cell(img?[new Paragraph({alignment:AlignmentType.CENTER,children:[img]})]:[p("[Image]",{align:AlignmentType.CENTER})]),txtCell(ph.comment||"")]}));

  children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:photoRows}));

  const doc=new Document({styles:{paragraphStyles:[{id:"Normal",name:"Normal",run:{font:"Arial",size:20}}]},sections:[{headers:{default:new Header({children:[headerTable]})},footers:{default:footer},properties:{page:{margin:{top:720,right:540,bottom:720,left:540}}},children}]});
  const blob=await Packer.toBlob(doc);
  const fname=(annexure.replace(/\s+/g,"_")+"_"+(insp.asset||"Inspection").replace(/[^a-z0-9]+/gi,"_")+"_"+(insp.date||"")+".docx").replace(/_+/g,"_");
  saveAs(blob,fname);
}

function Toast({msg,type}){

  const icon=type==="loading"?"⏳":type==="success"?"✓":type==="error"?"✕":"ℹ";

// ── OneDrive Setup ─────────────────────────────────────────────

    try{

      const me=await odGet("/me");

  const inp={width:"100%",padding:"10px 12px",border:"1px solid #334155",borderRadius:7,fontSize:14,color:"#f1f5f9",background:"#1e293b",outline:"none",fontFamily:"inherit",boxSizing:"border-box"};

        <div style={{fontSize:36,marginBottom:12,textAlign:"center"}}>☁️</div>
        <div style={{color:"#f1f5f9",fontSize:18,fontWeight:700,marginBottom:8,textAlign:"center"}}>Connect to OneDrive</div>

          Your inspections will be automatically saved to a folder called <b style={{color:"#e2e8f0"}}>Inspections App</b> in your OneDrive. Photos are saved alongside.<br/><br/>
          You need a free Microsoft account and a one-time Microsoft Azure App Registration (see guide below).
        </div>

        <div style={{background:"#1e293b",borderRadius:10,padding:16,marginBottom:16}}>
          <div style={{color:"#7dd3fc",fontSize:11,fontWeight:700,letterSpacing:"0.1em",marginBottom:10}}>AZURE APP REGISTRATION (ONE TIME)</div>
          <div style={{color:"#94a3b8",fontSize:12,lineHeight:1.9}}>
            1. Go to <a href="https://portal.azure.com" target="_blank" style={{color:"#7dd3fc"}}>portal.azure.com</a> → App registrations → + New registration<br/>
            2. Name: <b style={{color:"#e2e8f0"}}>Inspection App</b> · Accounts: <b style={{color:"#e2e8f0"}}>Personal Microsoft accounts only</b><br/>
            3. Redirect URI → <b style={{color:"#e2e8f0"}}>Single-page application</b>: <code style={{background:"#0f172a",color:"#7dd3fc",padding:"2px 6px",borderRadius:4,wordBreak:"break-all"}}>{window.location.origin}</code><br/>
            4. Click Register → copy <b style={{color:"#e2e8f0"}}>Application (client) ID</b><br/>
            5. API permissions → Microsoft Graph → Delegated → add <code style={{background:"#0f172a",color:"#7dd3fc",padding:"2px 6px",borderRadius:4}}>Files.ReadWrite</code> and <code style={{background:"#0f172a",color:"#7dd3fc",padding:"2px 6px",borderRadius:4}}>User.Read</code>
          </div>

        <div style={{marginBottom:14}}>

        </div>
        <div style={{marginBottom:20,display:"flex",gap:12,alignItems:"center"}}>
          <label style={{color:"#94a3b8",fontSize:13,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>

// ── Photo Section ──────────────────────────────────────────────
function PhotoSection({photos=[],onChange,readOnly,inspId}){
  const fileRef=useRef();
  const [geoLoading,setGeoLoading]=useState(false);

  function getGeo(){
    return new Promise((res)=>{
      if(!navigator.geolocation){res(null);return;}
      navigator.geolocation.getCurrentPosition(
        p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
        ()=>res(null),{timeout:8000}
      );
    });
  }

  async function handleFiles(files){
    setGeoLoading(true);
    const geo=await getGeo();
    setGeoLoading(false);
    const newPhotos=[...photos];
    for(const file of Array.from(files)){
      const reader=new FileReader();
      await new Promise(res=>{reader.onload=e=>{
        newPhotos.push({
          id:uid(),
          name:file.name,
          data:e.target.result,
          geo:geo?fmtCoord(geo.lat,geo.lng):null,
          geoAcc:geo?geo.acc:null,
          comment:"",
          timestamp:new Date().toISOString(),
        });
        res();
      };reader.readAsDataURL(file);});
    }
    onChange(newPhotos);
  }

  function updateComment(id,val){
    onChange(photos.map(p=>p.id===id?{...p,comment:val}:p));
  }
  function updateGeo(id,val){
    onChange(photos.map(p=>p.id===id?{...p,geo:val}:p));
  }
  function removePhoto(id){
    onChange(photos.filter(p=>p.id!==id));
  }
  function refreshGeo(id){
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(pos=>{
      const geo=fmtCoord(pos.coords.latitude,pos.coords.longitude);
      updateGeo(id,geo);
    },()=>{});
  }

  return(
    <div className="card">
      <div className="card-header">
        PHOTO CONDITION ASSESSMENT
        {!readOnly&&<Btn sm cls="btn-primary" onClick={()=>fileRef.current.click()} disabled={geoLoading}>
          {geoLoading?"Getting location…":"+ Add Photos"}
        </Btn>}
      </div>
      {/* Accept both camera and file picker on mobile; file picker on desktop */}
      <input ref={fileRef} type="file" accept="image/*" multiple
        style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
      <div style={{padding:14}}>
        {photos.length===0&&<div style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:"20px 0"}}>No photos yet. Tap + Add Photos to select from files or camera.</div>}
        {photos.map((ph,i)=>(
          <div key={ph.id} style={{border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden",marginBottom:10}}>
            <div style={{display:"flex",gap:10,padding:10}}>
              <div style={{flexShrink:0,width:100,height:80,borderRadius:6,overflow:"hidden",background:"#f1f5f9"}}>
                <img src={ph.data} alt={ph.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              </div>
              <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
                <div style={{fontSize:11,fontWeight:700,color:"#334155"}}>Photo {i+1}: {ph.name}</div>
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,color:"#64748b"}}>📍</span>
                  <input type="text" value={ph.geo||""} onChange={e=>updateGeo(ph.id,e.target.value)}
                    placeholder="Coordinates (auto or enter manually)"
                    style={{flex:1,padding:"4px 8px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:12,outline:"none",minWidth:0}}
                    readOnly={readOnly}/>
                  {!readOnly&&<button onClick={()=>refreshGeo(ph.id)} style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>📡 Update</button>}
                </div>
                {ph.geoAcc&&<div style={{fontSize:10,color:"#94a3b8"}}>Accuracy: ±{Math.round(ph.geoAcc)}m</div>}
                <input type="text" value={ph.comment||""} onChange={e=>updateComment(ph.id,e.target.value)}
                  placeholder="Photo comment / description"
                  style={{padding:"5px 8px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13,outline:"none"}}
                  readOnly={readOnly}/>
              </div>
              {!readOnly&&<button onClick={()=>removePhoto(ph.id)} style={{background:"none",border:"none",color:"#cbd5e1",fontSize:18,cursor:"pointer",alignSelf:"flex-start"}}>🗑</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Inspection Form (tabbed) ───────────────────────────────────

          <div style={{display:"flex",gap:5,flexShrink:0,flexWrap:"wrap"}}>

      <div style={{padding:"16px 14px",maxWidth:860,margin:"0 auto"}}>

        {/* DETAILS TAB */}
        {tab==="details"&&<>
          <div className="card">
            <div className="card-header">ASSET DETAILS</div>
            <div className="card-body" style={{display:"flex",flexDirection:"column",gap:12}}>
              <Field label="Asset Name / Location" value={insp.asset} onChange={v=>set("asset",v)} readOnly={ro} placeholder="e.g. Quay 501/502 sump"/>
              <Field label="Section" value={insp.section} onChange={v=>set("section",v)} readOnly={ro} placeholder="e.g. Section 4"/>
              <div className="form-row">
                <Field label="Inspection Date" type="date" value={insp.date} onChange={v=>set("date",v)} readOnly={ro}/>
                <Field label="Financial Year" value={insp.financialYear} onChange={v=>set("financialYear",v)} readOnly={ro} placeholder="2025/26"/>
              </div>
              <div className="form-row">
                <Field label="Main Asset Group" value={template.assetGroup} readOnly/>
                <Field label="Sub Asset Group" value={template.subAssetGroup} readOnly/>
              </div>
            </div>
          </div>
          <div className="card">
            <div className="card-header">INSPECTION TEAM</div>
            <div className="card-body">
              <div className="form-row">
                <Field label="Team Leader" value={insp.teamLeader} onChange={v=>set("teamLeader",v)} readOnly={ro} placeholder="Full name"/>
                <Field label="Designation" value={insp.designation} onChange={v=>set("designation",v)} readOnly={ro} placeholder="e.g. Civil Engineer-In-Training"/>
              </div>
            </div>
          </div>
          {insp.signedOff&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"12px 16px",display:"flex",gap:12,alignItems:"center"}}>
            <span style={{fontSize:22}}>✅</span>
            <div>
              <div style={{fontWeight:700,color:"#15803d",fontSize:14}}>Signed Off</div>
              <div style={{color:"#16a34a",fontSize:12}}>By {insp.teamLeader||"Team Leader"} · {insp.signedAt?new Date(insp.signedAt).toLocaleString():""}</div>
            </div>
          </div>}
        </>}

        {/* CHECKLIST TAB */}
        {tab==="checklist"&&<div className="card">
          <div className="card-header">INSPECTION CHECKLIST</div>
          <div style={{padding:14}}>
            {template.sections.map((sec,si)=>(
              <div key={sec.id} style={{border:"1px solid #e2e8f0",borderRadius:10,overflow:"hidden",marginBottom:12}}>
                <div style={{background:"#0f172a",color:"#f1f5f9",padding:"8px 14px",fontSize:12,fontWeight:700,letterSpacing:"0.1em"}}>{si+1}. {sec.title}</div>
                {sec.items.map((item,ii)=>(
                  <div key={item.id} style={{padding:"12px 14px",borderBottom:ii<sec.items.length-1?"1px solid #f1f5f9":"none"}}>
                    <div style={{fontSize:13,color:"#1e293b",marginBottom:8}}><span style={{color:"#94a3b8",marginRight:6,fontWeight:700}}>{si+1}.{ii+1}</span>{item.text}</div>
                    <RadioPill value={insp.checks?.[item.id]?.answer||""} onChange={v=>setCheck(item.id,"answer",v)} disabled={ro}/>
                    <input type="text" placeholder="Comments…" readOnly={ro} value={insp.checks?.[item.id]?.comment||""}
                      onChange={e=>setCheck(item.id,"comment",e.target.value)}
                      style={{width:"100%",marginTop:8,padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:6,fontSize:13,color:"#475569",background:ro?"#f8fafc":"#fff",outline:"none",fontFamily:"inherit"}}/>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>}

        {/* RATING TAB */}
        {tab==="rating"&&<>
          <div className="card">
            <div className="card-header">CONDITION RATING</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:420}}>
                <thead>
                  <tr style={{background:"#f8fafc"}}>
                    {["Item","Weight","Prev. Rating (%)","Rating (%)","Weighted Avg"].map(h=>(
                      <th key={h} style={{padding:"8px 10px",textAlign:"left",borderBottom:"1px solid #e2e8f0",color:"#64748b",fontSize:11,fontWeight:700}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {template.ratingWeights.map(w=>{
                    const val=parseFloat(insp.ratings?.[w.id]);
                    const pval=parseFloat(insp.prevRatings?.[w.id]);
                    const wa=!isNaN(val)?((val*w.weight)/100).toFixed(1):"";
                    return(
                      <tr key={w.id} style={{borderBottom:"1px solid #f1f5f9"}}>
                        <td style={{padding:"8px 10px",color:"#1e293b"}}>{w.label}</td>
                        <td style={{padding:"8px 10px",color:"#64748b"}}>{w.weight}%</td>
                        <td style={{padding:"8px 10px"}}>
                          {ro?<span style={{color:"#64748b"}}>{isNaN(pval)?"—":pval+"%"}</span>
                            :<input type="number" min="0" max="100" value={insp.prevRatings?.[w.id]||""}
                              onChange={e=>setPrevRating(w.id,e.target.value)}
                              placeholder="prev"
                              style={{width:64,padding:"4px 7px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:13,outline:"none",fontFamily:"inherit"}}/>}
                        </td>
                        <td style={{padding:"8px 10px"}}>
                          {ro?<span>{insp.ratings?.[w.id]||"—"}</span>
                            :<input type="number" min="0" max="100" value={insp.ratings?.[w.id]||""}
                              onChange={e=>setRating(w.id,e.target.value)}
                              style={{width:64,padding:"4px 7px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:13,outline:"none",fontFamily:"inherit"}}/>}
                        </td>
                        <td style={{padding:"8px 10px",color:"#64748b"}}>{wa||"—"}</td>

                    );

                  <tr style={{background:"#f8fafc",fontWeight:700}}>
                    <td style={{padding:"8px 10px",color:"#0f172a"}}>TOTAL</td>
                    <td style={{padding:"8px 10px"}}>100%</td>
                    <td style={{padding:"8px 10px",color:"#64748b"}}>{prevTotal!=null?prevTotal+"%":"—"}</td>
                    <td></td>
                    <td style={{padding:"8px 10px"}}>

                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            {cond&&<div style={{padding:"10px 14px",background:cond.color+"11",borderTop:"1px solid "+cond.color+"33",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
              <Badge color={cond.color}>{cond.condition}</Badge>
              <span style={{fontSize:12,color:"#475569"}}>{cond.action}</span>
              <span style={{fontSize:11,color:"#94a3b8"}}>Repairs: {cond.repairTime}</span>
            </div>}
          </div>
          {/* Rating scale reference */}
          <div className="card">
            <div className="card-header">GENERAL RATING SCALE REFERENCE</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:600}}>
                <thead><tr style={{background:"#0f172a"}}>
                  {["Rating %","Condition","Action","Repair Time","Maint. Time"].map(h=>(
                    <th key={h} style={{padding:"7px 10px",color:"#f1f5f9",fontWeight:700,textAlign:"left"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {CONDITION_SCALE.map((c,i)=>(
                    <tr key={i} style={{background:i%2===0?"#f8fafc":"#fff",borderBottom:"1px solid #e2e8f0"}}>
                      <td style={{padding:"6px 10px",fontWeight:700,color:c.color}}>{c.range[0]}-{c.range[1]}</td>
                      <td style={{padding:"6px 10px",color:c.color,fontWeight:600}}>{c.condition}</td>
                      <td style={{padding:"6px 10px",color:"#475569"}}>{c.action}</td>
                      <td style={{padding:"6px 10px",color:"#64748b"}}>{c.repairTime}</td>
                      <td style={{padding:"6px 10px",color:"#64748b"}}>{c.maintTime}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>}

        {/* PHOTOS TAB */}
        {tab==="photos"&&
          <PhotoSection photos={insp.photos||[]} onChange={v=>set("photos",v)} readOnly={ro} inspId={insp.id}/>
        }
      </div>
    </div>
  );
}


function TemplateManager({templates,onSave,onClose}){
  const [items,setItems]=useState(templates.map(cloneTemplate));
  const [selected,setSelected]=useState(items[0]?.id||"");
  const current=items.find(t=>t.id===selected)||items[0];
  function updateTemplate(patch){setItems(items.map(t=>t.id===current.id?normalizeTemplate({...t,...patch}):t));}
  function updateSection(si,patch){const sections=current.sections.map((s,i)=>i===si?{...s,...patch}:s);updateTemplate({sections});}
  function updateItem(si,ii,text){const sections=current.sections.map((s,i)=>i===si?{...s,items:s.items.map((it,j)=>j===ii?{...it,text}:it)}:s);updateTemplate({sections});}
  function addSection(){const sections=[...current.sections,{id:uid(),title:"NEW SECTION",items:[{id:uid(),text:"New checklist question"}]}];updateTemplate({sections});}
  function addItem(si){const sections=current.sections.map((s,i)=>i===si?{...s,items:[...s.items,{id:uid(),text:"New checklist question"}]}:s);updateTemplate({sections});}
  function deleteSection(si){if(!confirm("Delete this section?"))return;updateTemplate({sections:current.sections.filter((_,i)=>i!==si)});}
  function deleteItem(si,ii){const sections=current.sections.map((s,i)=>i===si?{...s,items:s.items.filter((_,j)=>j!==ii)}:s);updateTemplate({sections});}
  function updateWeight(i,patch){updateTemplate({ratingWeights:current.ratingWeights.map((w,j)=>j===i?{...w,...patch}:w)});}
  function addWeight(){updateTemplate({ratingWeights:[...current.ratingWeights,{id:uid(),label:"New rating item",weight:0}]});}
  function deleteWeight(i){updateTemplate({ratingWeights:current.ratingWeights.filter((_,j)=>j!==i)});}
  function duplicateTemplate(){const copy=normalizeTemplate({...cloneTemplate(current),id:"tmpl_"+Date.now(),name:current.name+" Copy"});setItems([...items,copy]);setSelected(copy.id);}
  function newTemplate(){const blank=normalizeTemplate({...cloneTemplate(DEFAULT_TEMPLATE),id:"tmpl_"+Date.now(),name:"New Asset Template",assetGroup:"",subAssetGroup:"",sections:[{id:uid(),title:"GENERAL",items:[{id:uid(),text:"Checklist question"}]}],ratingWeights:[{id:uid(),label:"Overall Condition",weight:100}]});setItems([...items,blank]);setSelected(blank.id);}
  function removeTemplate(){if(items.length===1){alert("At least one template is required.");return;} if(!confirm("Delete this template?"))return;const next=items.filter(t=>t.id!==current.id);setItems(next);setSelected(next[0].id);}
  const input={width:"100%",padding:"8px 10px",border:"1px solid #e2e8f0",borderRadius:7,fontSize:13};
  return <div style={{background:"#f0f4f8",minHeight:"100vh",fontFamily:"system-ui,sans-serif"}}>
    <div className="sticky-hdr" style={{background:"#0f172a",padding:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div><div style={{color:"#94a3b8",fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase"}}>Template editor</div><h1 style={{color:"#f1f5f9",fontSize:18,margin:0}}>Checklist & Report Templates</h1></div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Btn sm cls="btn-dark" onClick={onClose}>Back</Btn><Btn sm cls="btn-success" onClick={()=>onSave(items.map(normalizeTemplate))}>Save Templates</Btn></div>
      </div>
    </div>
    <div style={{maxWidth:980,margin:"0 auto",padding:14}}>
      <div className="card"><div className="card-header">TEMPLATE SELECTION</div><div className="card-body" style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <select className="field-input" style={{flex:1,minWidth:220}} value={current?.id||""} onChange={e=>setSelected(e.target.value)}>{items.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
        <Btn sm cls="btn-primary" onClick={newTemplate}>+ New</Btn><Btn sm cls="btn-dark" onClick={duplicateTemplate}>Duplicate</Btn><Btn sm cls="btn-danger" onClick={removeTemplate}>Delete</Btn>
      </div></div>
      {current&&<>
        <div className="card"><div className="card-header">REPORT DETAILS</div><div className="card-body" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10}}>
          <Field label="Template Name" value={current.name} onChange={v=>updateTemplate({name:v})}/>
          <Field label="Report Code" value={current.reportCode} onChange={v=>updateTemplate({reportCode:v})}/>
          <Field label="Annexure" value={current.annexure} onChange={v=>updateTemplate({annexure:v})}/>
          <Field label="Financial Year" value={current.financialYear} onChange={v=>updateTemplate({financialYear:v})}/>
          <Field label="Document Title" value={current.documentTitle} onChange={v=>updateTemplate({documentTitle:v})}/>
          <Field label="Report Header" value={current.reportTitle} onChange={v=>updateTemplate({reportTitle:v})}/>
          <Field label="Main Asset Group" value={current.assetGroup} onChange={v=>updateTemplate({assetGroup:v})}/>
          <Field label="Sub Asset Group" value={current.subAssetGroup} onChange={v=>updateTemplate({subAssetGroup:v})}/>
        </div></div>
        <div className="card"><div className="card-header">CHECKLIST CONTENT <Btn sm cls="btn-primary" onClick={addSection}>+ Section</Btn></div><div className="card-body">
          {current.sections.map((sec,si)=><div key={sec.id} style={{border:"1px solid #e2e8f0",borderRadius:10,marginBottom:12,overflow:"hidden"}}>
            <div style={{background:"#f8fafc",padding:10,display:"flex",gap:8,alignItems:"center"}}><strong>{si+1}.</strong><input style={input} value={sec.title} onChange={e=>updateSection(si,{title:e.target.value})}/><Btn sm cls="btn-primary" onClick={()=>addItem(si)}>+ Item</Btn><Btn sm cls="btn-danger" onClick={()=>deleteSection(si)}>Delete</Btn></div>
            <div style={{padding:10,display:"flex",flexDirection:"column",gap:8}}>{sec.items.map((it,ii)=><div key={it.id} style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:12,color:"#64748b",width:36}}>{si+1}.{ii+1}</span><input style={input} value={it.text} onChange={e=>updateItem(si,ii,e.target.value)}/><Btn sm cls="btn-danger" onClick={()=>deleteItem(si,ii)}>×</Btn></div>)}</div>
          </div>)}
        </div></div>
        <div className="card"><div className="card-header">CONDITION RATING WEIGHTS <Btn sm cls="btn-primary" onClick={addWeight}>+ Rating Item</Btn></div><div className="card-body" style={{display:"flex",flexDirection:"column",gap:8}}>
          {current.ratingWeights.map((w,i)=><div key={w.id} style={{display:"grid",gridTemplateColumns:"1fr 110px 60px",gap:8,alignItems:"center"}}><input style={input} value={w.label} onChange={e=>updateWeight(i,{label:e.target.value})}/><input style={input} type="number" value={w.weight} onChange={e=>updateWeight(i,{weight:e.target.value})}/><Btn sm cls="btn-danger" onClick={()=>deleteWeight(i)}>×</Btn></div>)}
          <div style={{fontSize:12,color:"#64748b"}}>Weight total: {current.ratingWeights.reduce((a,w)=>a+(Number(w.weight)||0),0)}%</div>
        </div></div>
      </>}
    </div>
  </div>;
}

// ── Root App ───────────────────────────────────────────────────
function App(){
  const [templates,setTemplates]=useState([]);
  const [selectedTemplateId,setSelectedTemplateId]=useState("");
  const [inspections,setInspections]=useState([]);
  const [odConfig,setOdConfig]=useState(null);
  const [odConnected,setOdConnected]=useState(false);
  const [view,setView]=useState("list");
  const [current,setCurrent]=useState(null);
  const [readOnly,setReadOnly]=useState(false);
  const [saving,setSaving]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"info"});
  const [sortBy,setSortBy]=useState("date");
  const [groupBy,setGroupBy]=useState("none");
  const [filterInspector,setFilterInspector]=useState("");
  const tmpl=templates.find(t=>t.id===selectedTemplateId)||templates[0]||normalizeTemplate(DEFAULT_TEMPLATE);

  useEffect(()=>{
    const loadedTemplates=loadTemplates();
    setTemplates(loadedTemplates);setSelectedTemplateId(loadedTemplates[0].id);
    setInspections(lsGet(INSPECTIONS_KEY,[]));
    const cfg=lsGet(OD_CONFIG_KEY,null);
    if(cfg){setOdConfig(cfg);_odConfig=cfg;}
  },[]);

  useEffect(()=>{
    const back=()=>setView("list");
    const edit=()=>setReadOnly(false);
    window.addEventListener("navBack",back);
    window.addEventListener("editInsp",edit);
    return()=>{window.removeEventListener("navBack",back);window.removeEventListener("editInsp",edit);};
  },[]);

  function showToast(msg,type="info",dur=3500){setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"info"}),dur);}
  function persist(list){setInspections(list);lsSet(INSPECTIONS_KEY,list);}
  function templateFor(insp){return templates.find(t=>t.id===insp?.templateId)||templates.find(t=>t.name===insp?.templateName)||tmpl;}

  function saveTemplateList(list){const clean=list.map(normalizeTemplate);setTemplates(clean);saveTemplates(clean);if(!clean.some(t=>t.id===selectedTemplateId))setSelectedTemplateId(clean[0].id);showToast("Templates saved ✓","success");setView("list");}

  function startNew(){
    const t=tmpl;
    setCurrent({id:"insp_"+Date.now(),createdAt:new Date().toISOString(),templateId:t.id,templateName:t.name,asset:"",teamLeader:"",designation:"",date:new Date().toISOString().slice(0,10),section:"",financialYear:t.financialYear||"2025/26",checks:emptyChecks(t),ratings:emptyRatings(t),prevRatings:emptyPrevRatings(t),photos:[],signedOff:false});
    setReadOnly(false);setView("form");
  }
  function openInspection(insp){const t=templateFor(insp);setCurrent(migrateInspectionForTemplate({...insp},t));setSelectedTemplateId(t.id);setReadOnly(true);setView("form");}

  async function saveInspection(){
    setSaving(true);const t=templateFor(current);const upd=migrateInspectionForTemplate({...current,templateId:t.id,templateName:t.name},t);const list=[upd,...inspections.filter(i=>i.id!==current.id)];persist(list);setCurrent(upd);
    if(odConfig&&_odToken){try{await saveInspectionToOD(upd);showToast("Saved to OneDrive ✓","success");}catch(e){showToast("Saved locally. OneDrive: "+e.message,"error");}}else showToast("Saved locally ✓","success");
    setSaving(false);
  }
  async function submitInspection(){const t=templateFor(current);const upd=migrateInspectionForTemplate({...current,signedOff:true,signedAt:new Date().toISOString(),templateId:t.id,templateName:t.name},t);const list=[upd,...inspections.filter(i=>i.id!==current.id)];persist(list);if(odConfig&&_odToken){try{await saveInspectionToOD(upd);}catch{}}showToast("Signed off ✓","success");setView("list");}
  async function pullOD(){if(!odConfig){showToast("OneDrive not configured","error");return;}if(!_odToken){showToast("Signing in to OneDrive…","loading",8000);try{await odSignIn(odConfig);setOdConnected(true);}catch(e){showToast("Sign in failed: "+e.message,"error");return;}}setSyncing(true);showToast("Pulling from OneDrive…","loading",10000);try{const remote=await loadInspectionsFromOD();const lm=Object.fromEntries(inspections.map(i=>[i.id,i]));const rm=Object.fromEntries(remote.map(i=>[i.id,i]));persist(Object.values({...lm,...rm}));showToast("Synced "+remote.length+" inspection(s) ✓","success");}catch(e){showToast("Sync failed: "+e.message,"error");}setSyncing(false);}
  async function signInOD(){if(!odConfig)return;showToast("Opening OneDrive sign-in…","loading",8000);try{await odSignIn(odConfig);setOdConnected(true);showToast("OneDrive connected ✓","success");}catch(e){showToast("Sign in failed: "+e.message,"error");}}
  async function handleExport(){try{const t=templateFor(current);showToast("Generating Word document…","loading",8000);await exportToWord(current,t);showToast("Word document downloaded ✓","success");}catch(e){showToast("Export failed: "+e.message,"error");}}
  function deleteInsp(id){if(confirm("Delete this inspection?"))persist(inspections.filter(i=>i.id!==id));}

  const sortOptions=[{key:"date",label:"Date"},{key:"inspector",label:"Inspector"},{key:"asset",label:"Asset"},{key:"rating",label:"Rating"},{key:"status",label:"Status"}];
  const groupOptions=[{key:"none",label:"No Grouping"},{key:"inspector",label:"By Inspector"},{key:"section",label:"By Section"},{key:"status",label:"By Status"},{key:"date",label:"By Month"},{key:"template",label:"By Template"}];
  function sortedInspections(){let list=[...inspections];if(filterInspector)list=list.filter(i=>(i.teamLeader||"").toLowerCase().includes(filterInspector.toLowerCase()));list.sort((a,b)=>{const ta=templateFor(a),tb=templateFor(b);if(sortBy==="date") return (b.date||"").localeCompare(a.date||"");if(sortBy==="inspector") return (a.teamLeader||"").localeCompare(b.teamLeader||"");if(sortBy==="asset") return (a.asset||"").localeCompare(b.asset||"");if(sortBy==="rating") return (calcWeighted(b.ratings,tb.ratingWeights)||0)-(calcWeighted(a.ratings,ta.ratingWeights)||0);if(sortBy==="status") return (b.signedOff?1:0)-(a.signedOff?1:0);return 0;});return list;}
  function groupedInspections(){const list=sortedInspections();if(groupBy==="none") return [["",list]];const map=new Map();list.forEach(insp=>{let key="";if(groupBy==="inspector") key=insp.teamLeader||"Unknown";else if(groupBy==="section") key=insp.section||"No Section";else if(groupBy==="status") key=insp.signedOff?"Signed Off":"Draft";else if(groupBy==="date") key=insp.date?(insp.date.slice(0,7)):"No Date";else if(groupBy==="template") key=(templateFor(insp)||{}).name||"Unknown Template";if(!map.has(key))map.set(key,[]);map.get(key).push(insp);});return Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0]));}

  if(view==="odSetup") return <ODSetup onSave={cfg=>{lsSet(OD_CONFIG_KEY,cfg);setOdConfig(cfg);_odConfig=cfg;setView("list");showToast("OneDrive configured ✓","success");}} onSkip={()=>setView("list")}/>;
  if(view==="templates") return <><TemplateManager templates={templates.length?templates:[normalizeTemplate(DEFAULT_TEMPLATE)]} onSave={saveTemplateList} onClose={()=>setView("list")}/><Toast {...toast}/></>;
  if(view==="form") {const t=templateFor(current);return <><InspectionForm inspection={migrateInspectionForTemplate(current,t)} template={t} readOnly={readOnly} onUpdate={setCurrent} onSave={saveInspection} onSubmit={submitInspection} onExport={handleExport} saving={saving}/><Toast {...toast}/></>;}

  const groups=groupedInspections();
  const allInspectors=[...new Set(inspections.map(i=>i.teamLeader).filter(Boolean))];
  return <div style={{fontFamily:"system-ui,sans-serif",background:"#f0f4f8",minHeight:"100vh"}}>
    <div style={{background:"#0f172a",padding:"16px 14px"}}>
      <div style={{color:"#94a3b8",fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:4}}>Asset Management · Inspection Reports</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:8}}>
        <h1 style={{color:"#f1f5f9",margin:0,fontSize:18,fontWeight:700}}>Asset Inspections</h1>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
          <Btn sm cls="btn-dark" onClick={()=>setView("templates")}>⚙ Templates</Btn>
          {!odConfig?<Btn sm cls="btn-orange" onClick={()=>setView("odSetup")}>☁️ OneDrive</Btn>:!odConnected?<Btn sm cls="btn-dark" onClick={signInOD}>☁️ Sign In</Btn>:<Btn sm cls="btn-dark" onClick={pullOD} disabled={syncing}>{syncing?"…":"↓ Sync"}</Btn>}
          <Btn sm cls="btn-primary" onClick={startNew}>+ New</Btn>
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}><span style={{fontSize:11,color:"#94a3b8"}}>New inspection template:</span><select value={selectedTemplateId} onChange={e=>setSelectedTemplateId(e.target.value)} style={{padding:"6px 10px",borderRadius:7,border:"1px solid #334155",background:"#1e293b",color:"#f1f5f9",fontSize:12}}>{templates.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
      {odConfig&&<div className="od-bar"><span style={{fontSize:11,color:odConnected?"#86efac":"#fbbf24"}}>{odConnected?"● OneDrive connected":"● OneDrive configured — tap Sign In"}</span><button onClick={()=>{lsSet(OD_CONFIG_KEY,null);setOdConfig(null);setOdConnected(false);showToast("Disconnected","info");}} style={{background:"none",border:"none",color:"#64748b",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>Disconnect</button></div>}
    </div>
    <div style={{padding:"14px"}}>
      <div className="card" style={{marginBottom:12}}><div className="card-header">SORT & FILTER</div><div className="card-body" style={{display:"flex",flexDirection:"column",gap:10}}>
        <div><div className="field-label" style={{marginBottom:6}}>Sort by</div><div className="sort-bar" style={{marginBottom:0}}>{sortOptions.map(o=><span key={o.key} className={"sort-pill"+(sortBy===o.key?" active":"")} onClick={()=>setSortBy(o.key)}>{o.label}</span>)}</div></div>
        <div><div className="field-label" style={{marginBottom:6}}>Group by</div><div className="sort-bar" style={{marginBottom:0}}>{groupOptions.map(o=><span key={o.key} className={"sort-pill"+(groupBy===o.key?" active":"")} onClick={()=>setGroupBy(o.key)}>{o.label}</span>)}</div></div>
        <div><div className="field-label" style={{marginBottom:4}}>Filter by inspector</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}><input type="text" value={filterInspector} onChange={e=>setFilterInspector(e.target.value)} placeholder="Type inspector name…" style={{flex:1,padding:"7px 10px",border:"1px solid #e2e8f0",borderRadius:7,fontSize:13,outline:"none",minWidth:120}}/>{allInspectors.map(n=><span key={n} className={"sort-pill"+(filterInspector===n?" active":"")} onClick={()=>setFilterInspector(filterInspector===n?"":n)} style={{cursor:"pointer"}}>{n}</span>)}</div></div>
      </div></div>
      {inspections.length===0?<div style={{textAlign:"center",color:"#94a3b8",padding:"60px 0",fontSize:14}}><div style={{fontSize:40,marginBottom:12}}>📋</div>No inspections yet.<br/>Choose a template and tap <strong>+ New</strong> to start.</div>:groups.map(([groupKey,items])=><div key={groupKey}>{groupBy!=="none"&&<div className="group-header">{groupKey} ({items.length})</div>}{items.map(insp=>{const t=templateFor(insp);const total=calcWeighted(insp.ratings,t.ratingWeights);const cond=getCondition(total);const filled=Object.values(insp.checks||{}).filter(c=>c.answer).length;const totalItems=Object.keys(insp.checks||{}).length;return <div key={insp.id} className="insp-card" onClick={()=>openInspection(insp)}><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}><span style={{fontWeight:700,color:"#0f172a",fontSize:14}}>{insp.asset||"Untitled"}</span>{insp.signedOff?<Badge color="#16a34a">Done</Badge>:<Badge color="#ca8a04">Draft</Badge>}{(insp.photos||[]).length>0&&<Badge color="#7c3aed">📷 {insp.photos.length}</Badge>}<Badge color="#2563eb">{t.name}</Badge></div><div style={{color:"#64748b",fontSize:12,display:"flex",gap:8,flexWrap:"wrap"}}><span>📅 {insp.date||"—"}</span><span>👤 {insp.teamLeader||"—"}</span>{insp.section&&<span>📍 {insp.section}</span>}<span>{filled}/{totalItems} items</span></div></div><div style={{display:"flex",alignItems:"center",gap:8}}>{total!=null&&<div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:cond?.color||"#1e293b"}}>{total}%</div><div style={{fontSize:9,color:"#94a3b8"}}>{cond?.condition}</div></div>}<button onClick={e=>{e.stopPropagation();deleteInsp(insp.id);}} style={{background:"none",border:"none",color:"#cbd5e1",fontSize:16,cursor:"pointer",padding:4}}>🗑</button></div></div>;})}</div>)}
    </div><Toast {...toast}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js?v=11")
    .then(r=>console.log("SW registered",r.scope))
    .catch(e=>console.warn("SW failed",e));
}
</script>
</body>
</html>
